<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador PDVs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="https://s3.amazonaws.com/botgen/Uploads/jyj300_1745513856.png" type="image/png">
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100">

  <div class="container">
    <div class="card shadow-lg p-4 border-0 text-center search-container">
      <img src="https://s3.amazonaws.com/botgen/Uploads/jyj300_1745513856.png" class="logo mx-auto mb-3" alt="Logo">
      <h1 class="display-6 fw-semibold mb-3">Búsqueda de PDVs</h1>

      <div class="d-flex justify-content-center mb-3">
        <button id="darkModeToggle" class="btn btn-outline-dark">🌙 Modo Oscuro</button>
      </div>

      <input type="text" id="searchInput" class="form-control mb-4" placeholder="Palabra clave" oninput="handleInput()">

      <div id="results"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
